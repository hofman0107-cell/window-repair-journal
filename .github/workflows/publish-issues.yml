name: Publish Issues to GitHub Pages and Cloudflare Pages

on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: publish-issues
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown bleach

      - name: Generate articles for GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/publish_issues.py

      - name: Generate Cloudflare Pages site
        run: |
          python cloudflare/generate.py

      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html articles/ cloudflare/site/

          if ! git diff --cached --quiet; then
            git commit -m "Update articles for GitHub and Cloudflare Pages"
            git push
          fi
