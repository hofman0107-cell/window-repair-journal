header, footer {
  padding: 24px;
  text-align: center;

header a {
  color: #315b43;

.article-content p {

.article-content img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 20px 0;
  border-radius: 6px;
}

.article-content a {
  text-decoration: underline;
}

.article-content ul,
.article-content ol {
  padding-left: 24px;

.article-content blockquote {
  border-left: 4px solid #315b43;
  margin: 20px 0;
  padding: 10px 20px;
  background: #f7f9f7;
}

.article-content pre {
  overflow-x: auto;
  padding: 16px;
  background: #f1f3f1;
  border-radius: 6px;
}

.article-content table {
  border-collapse: collapse;
  width: 100%;
  display: block;
  overflow-x: auto;
}

.article-content th,
.article-content td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}

.article-content hr {
  border: 0;
  border-top: 1px solid #ddd;
  margin: 24px 0;
}

footer {
  color: #66756b;
}

@media (max-width: 600px) {
  main {
    margin: 16px;
    padding: 20px;
  }
